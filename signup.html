<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Signup</title>

<link rel="stylesheet" href="signup.css">

</head>

<body>

<div class="signup-page">

    <!-- Left Illustration -->
    <div class="signup-left">
        <img src="https://img.freepik.com/free-vector/sign-page-abstract-concept-illustration_335657-2242.jpg?semt=ais_hybrid&w=740&q=80">
    </div>

    <!-- Right Form -->
    <div class="signup-right">

        <div class="signup-card">

            <h2>Create Account</h2>
            <p>Signup to access notes & question papers</p>

            <form action="/signup" method="POST">

                <input type="text" name="name" placeholder="Enter Name" required>

                <input type="email" name="email" placeholder="Enter Email" required>

                <input type="password" name="password" placeholder="Enter Password" required>

                <input type="text" name="key" placeholder="College Access Key" required>

                <button type="submit">Signup</button>

            </form>

            <div class="login-text">
                Already have an account? <a href="/login">Login</a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
