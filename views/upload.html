<!DOCTYPE html>
<html>
<head>
  <title>Staff Upload</title>
  <link rel="stylesheet" href="/upload.css">
</head>

<body>

<div class="page">

  <!-- LEFT ANIMATION -->
  <div class="side left">
    <div class="book b1">📘</div>
    <div class="book b2">📖</div>
  </div>

  <!-- CENTER FORM -->
  <div class="upload-box">

    <h1>📚 Upload Portal</h1>
    <p>Notes & Question Papers</p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

      <label>Department</label>
      <select name="department">
        <option>CSE</option>
        <option>IT</option>
        <option>ECE</option>
        <option>MECH</option>
        <option>CIVIL</option>
        <option>AI</option>
        <option>AGRI</option>
      </select>

      <label>Subject Name</label>
      <input type="text" name="subjectName">

      <label>Subject Code</label>
      <input type="text" name="subjectCode">

      <label>Type</label>
      <select name="type">
        <option value="note">Note</option>
        <option value="question">Question Paper</option>
      </select>

      <label>Upload File</label>
      <input type="file" name="pdf">

      <button type="submit">🚀 Upload</button>

    </form>
  </div>

  <!-- RIGHT ANIMATION -->
  <div class="side right">
    <div class="book b3">📕</div>
    <div class="book b4">📗</div>
  </div>

</div>

</body>
</html>
