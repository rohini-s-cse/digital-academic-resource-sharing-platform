<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login</title>
 <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-page">
    <div class="login-left">
      <img src="https://img.freepik.com/premium-vector/vector-character-man-standing-with-smartphone-minimalist-flat-design-style_844724-2637.jpg" alt="Login Illustration">
    </div>

    <div class="login-right">
      <div class="login-card">
        <h2>Welcome Back</h2>
        <p>Login to access your notes & question papers</p>
        <form action="/login" method="POST">
          <input type="email" name="email" placeholder="Email" required>
          <input type="password" name="password" placeholder="Password" required>
          <button type="submit">Login</button>
        </form>
        <p class="signup-text">Don't have an account? <a href="/signup">Sign Up</a></p>
      </div>
    </div>
  </div>

</body>
</html>
